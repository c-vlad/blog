baseURL = 'https://www.c-vlad.com/'
languageCode = 'en-us'
title = 'The Intelligence Layer'
canonifyURLs = true                          # forces absolute URLs
relativeURLs = false                         # optional, avoid relative links

theme = "book"

# [permalinks]
# articles = "/:slug/"   # Generates /article-name/ instead of /blog/article-name/

[permalinks]
post = "/:title/"

[taxonomies]
  category = "categories"
  tag = "tags"

[params]
  project = false
  BookTheme = "light"
  BookToC = true
  BookSection = "*"
 # BookLogo = "/images/AudienceIntelligence.png"
  BookLogo = "/images/TheIntelligenceLayer.png"
  math = true

[markup]
  [markup.goldmark]
    [markup.goldmark.extensions]
      math = true
      [markup.goldmark.extensions.passthrough]
        enable = true
        [markup.goldmark.extensions.passthrough.delimiters]
          block = [['\[', '\]'], ['$$', '$$']]
          inline = [['\(', '\)'], ['$', '$']]
    [markup.goldmark.renderer]
      unsafe = true
